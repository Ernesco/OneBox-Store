<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneBox Store</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d0d0d; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

.header { background: #111; border-bottom: 1px solid #222; padding: 14px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
.header img { height: 46px; object-fit: contain; }
.back-btn { background: #222; border: 1px solid #333; color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; display: none; }
.back-btn.visible { display: block; }

/* MENU PRINCIPAL */
.home-screen { display: block; }
.hero { padding: 28px 24px 16px; }
.hero h2 { font-size: 22px; font-weight: 700; color: #fff; }
.hero p { font-size: 13px; color: #666; margin-top: 4px; }

.cats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 8px 24px 24px; }
.cat-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 18px; padding: 24px 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; transition: border-color 0.2s, transform 0.15s; }
.cat-card:hover { border-color: #555; transform: scale(1.02); }
.cat-icon { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.cat-name { font-size: 15px; font-weight: 700; color: #fff; text-align: center; }
.cat-count { font-size: 12px; color: #555; }

.novedades-section { padding: 0 24px 32px; }
.section-title { font-size: 12px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px; }
.feat-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s; }
.feat-card:hover { border-color: #444; }
.feat-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.feat-info { flex: 1; }
.feat-name { font-size: 14px; font-weight: 600; color: #fff; }
.feat-cat { font-size: 12px; color: #555; margin-top: 2px; }
.feat-btn { background: #16a34a; color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
.feat-btn.update { background: #f59e0b; color: #000; }
.badge-new { background: #dc2626; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 99px; margin-left: 6px; }

/* PANTALLA DE CATEGORIA */
.cat-screen { display: none; }
.cat-header { padding: 20px 24px 8px; }
.cat-header h2 { font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
.cat-header p { font-size: 13px; color: #666; margin-top: 4px; }

.apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; padding: 16px 24px 32px; }
.app-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; position: relative; }
.app-card:hover { transform: scale(1.03); border-color: #444; }
.app-card.updating { border-color: #f59e0b; }
.badge-nuevo { position: absolute; top: 10px; right: 10px; background: #dc2626; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.badge-update { position: absolute; top: 10px; right: 10px; background: #f59e0b; color: #000; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.app-icon { width: 60px; height: 60px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.app-name { font-size: 14px; font-weight: 600; text-align: center; }
.app-version { font-size: 11px; color: #666; }
.app-size { font-size: 11px; color: #555; }
.btn-instalar { width: 100%; padding: 8px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.btn-instalar:hover { opacity: 0.85; }
.btn-green { background: #16a34a; color: #fff; }
.btn-amber { background: #f59e0b; color: #000; }
.empty { text-align: center; padding: 60px 20px; color: #555; grid-column: 1/-1; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 28px; max-width: 400px; width: 100%; }
.modal-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.modal-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-meta { font-size: 12px; color: #666; margin-top: 2px; }
.modal-desc { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; }
.btn-modal-install { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; background: #16a34a; color: #fff; }
.btn-modal-close { padding: 12px 20px; border-radius: 10px; border: 1px solid #333; background: transparent; color: #aaa; font-size: 14px; cursor: pointer; }

.update-banner { background: #1a3a1a; border-bottom: 1px solid #2d6a2d; color: #6ddb6d; padding: 10px 24px; font-size: 13px; display: none; align-items: center; gap: 8px; }
.update-banner.visible { display: flex; }
.footer { text-align: center; padding: 24px; color: #333; font-size: 12px; }

@media (max-width: 480px) {
  .cats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 8px 16px 20px; }
  .apps-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px 16px 24px; }
  .header { padding: 12px 16px; }
  .header img { height: 36px; }
}
</style>
</head>
<body>

<div class="header">
  <img id="logoImg" alt="OneBox Store">
  <div style="flex:1"></div>
  <button class="back-btn" id="backBtn" onclick="volverMenu()">← Volver</button>
</div>

<div class="update-banner" id="updateBanner">
  <span id="updateMsg"></span>
</div>

<!-- PANTALLA PRINCIPAL -->
<div class="home-screen" id="homeScreen">
  <div class="hero">
    <h2>Bienvenido 👋</h2>
    <p>Elegí una categoría para ver las apps disponibles</p>
  </div>

  <div class="cats-grid">
    <div class="cat-card" onclick="verCategoria('Tv, Series y Peliculas')">
      <div class="cat-icon" style="background:#1a1a3a;">🎬</div>
      <div class="cat-name">TV, Series y Películas</div>
      <div class="cat-count" id="count-tv">0 apps</div>
    </div>
    <div class="cat-card" onclick="verCategoria('Deportes')">
      <div class="cat-icon" style="background:#1a3a1a;">⚽</div>
      <div class="cat-name">Deportes</div>
      <div class="cat-count" id="count-dep">0 apps</div>
    </div>
    <div class="cat-card" onclick="verCategoria('Anime')">
      <div class="cat-icon" style="background:#3a1a3a;">🌸</div>
      <div class="cat-name">Anime</div>
      <div class="cat-count" id="count-ani">0 apps</div>
    </div>
    <div class="cat-card" onclick="verCategoria('Utilidades')">
      <div class="cat-icon" style="background:#2a2a1a;">🔧</div>
      <div class="cat-name">Utilidades</div>
      <div class="cat-count" id="count-util">0 apps</div>
    </div>
  </div>

  <div class="novedades-section">
    <div class="section-title">Novedades</div>
    <div id="novedadesLista"></div>
  </div>

  <div class="footer">OneBox Store &mdash; Your All-In-One Web Solutions</div>
</div>

<!-- PANTALLA DE CATEGORIA -->
<div class="cat-screen" id="catScreen">
  <div class="cat-header">
    <h2 id="catTitle"></h2>
    <p id="catSubtitle"></p>
  </div>
  <div class="apps-grid" id="appsGrid"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-icon" id="modalIcono"></div>
      <div>
        <div class="modal-title" id="modalNombre"></div>
        <div class="modal-meta" id="modalMeta"></div>
      </div>
    </div>
    <div class="modal-desc" id="modalDesc"></div>
    <div class="modal-actions">
      <button class="btn-modal-install" id="modalBtn" onclick="instalar()">Descargar e instalar</button>
      <button class="btn-modal-close" onclick="document.getElementById('modal').classList.remove('open')">Cancelar</button>
    </div>
  </div>
</div>

function cargarApps() {
  actualizarContadores();
  renderNovedades();
  verificarActualizaciones();
}

function actualizarContadores() {
  Object.keys(catMap).forEach(function(cat) {
    var count = apps.filter(function(a) { return a.categoria === cat; }).length;
    var el = document.getElementById(catMap[cat]);
    if (el) el.textContent = count + (count === 1 ? ' app' : ' apps');
  });
}

function renderNovedades() {
  var novedades = apps.filter(function(a) { return a.nuevo; });
  var lista = document.getElementById('novedadesLista');
  if (!novedades.length) {
    lista.innerHTML = '<p style="color:#555;font-size:13px;padding:8px 0;">No hay novedades por el momento.</p>';
    return;
  }
  lista.innerHTML = novedades.map(function(app) {
    var instalada = versiones[app.id];
    var tieneUpdate = instalada && instalada !== app.version;
    var btnTxt = tieneUpdate ? 'Actualizar' : 'Instalar';
    var btnClass = tieneUpdate ? 'update' : '';
    return '<div class="feat-card" onclick="abrirModal(' + app.id + ')">' +
      '<div class="feat-icon" style="background:' + app.color + '">' + app.icono + '</div>' +
      '<div class="feat-info">' +
        '<div class="feat-name">' + app.nombre + '<span class="badge-new">NUEVA</span></div>' +
        '<div class="feat-cat">' + app.categoria + ' · ' + app.tamano + '</div>' +
      '</div>' +
      '<button class="feat-btn ' + btnClass + '" onclick="event.stopPropagation();instalarDirecto(' + app.id + ')">' + btnTxt + '</button>' +
    '</div>';
  }).join('');
}

function verCategoria(cat) {
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('catScreen').style.display = 'block';
  document.getElementById('backBtn').classList.add('visible');
  document.getElementById('catTitle').textContent = (catIconos[cat] || '') + '  ' + cat;
  var filtradas = apps.filter(function(a) { return a.categoria === cat; });
  document.getElementById('catSubtitle').textContent = filtradas.length + ' app' + (filtradas.length === 1 ? '' : 's') + ' disponibles';
  renderApps(filtradas);
}

function volverMenu() {
  document.getElementById('homeScreen').style.display = 'block';
  document.getElementById('catScreen').style.display = 'none';
  document.getElementById('backBtn').classList.remove('visible');
}

    if (app.nuevo && !instalada) badge = '<span class="badge-nuevo">NUEVA</span>';
    else if (tieneUpdate) badge = '<span class="badge-update">UPDATE</span>';
    var btnClass = tieneUpdate ? 'btn-amber' : 'btn-green';
    var btnTxt = tieneUpdate ? 'Actualizar' : (instalada ? 'Reinstalar' : 'Instalar');
    return '<div class="app-card' + (tieneUpdate ? ' updating' : '') + '" onclick="abrirModal(' + app.id + ')">' +
      badge +
      '<div class="app-icon" style="background:' + app.color + '">' + app.icono + '</div>' +
      '<div class="app-name">' + app.nombre + '</div>' +
      '<div class="app-version">v' + app.version + '</div>' +
      '<div class="app-size">' + app.tamano + '</div>' +
      '<button class="btn-instalar ' + btnClass + '" onclick="event.stopPropagation();instalarDirecto(' + app.id + ')">' + btnTxt + '</button>' +
    '</div>';
  }).join('');
}

function verificarActualizaciones() {
  var updates = apps.filter(function(a) { return versiones[a.id] && versiones[a.id] !== a.version; });
  if (updates.length > 0) {
    var banner = document.getElementById('updateBanner');
    document.getElementById('updateMsg').textContent = 'Hay ' + updates.length + ' actualizacion(es) disponible(s): ' + updates.map(function(u) { return u.nombre; }).join(', ');
    banner.classList.add('visible');
  }
}

function abrirModal(id) {
  var app = apps.find(function(a) { return a.id === id; });
  appActual = app;
  document.getElementById('modalIcono').style.background = app.color;
  document.getElementById('modalIcono').textContent = app.icono;
  document.getElementById('modalNombre').textContent = app.nombre;
  document.getElementById('modalMeta').textContent = 'v' + app.version + ' - ' + app.tamano + ' - ' + app.categoria;
  document.getElementById('modalDesc').textContent = app.descripcion;
  var instalada = versiones[app.id];
  var tieneUpdate = instalada && instalada !== app.version;
  document.getElementById('modalBtn').textContent = tieneUpdate ? 'Actualizar' : (instalada ? 'Reinstalar' : 'Descargar e instalar');
  document.getElementById('modal').classList.add('open');
}

function instalar() {
  if (!appActual) return;
  iniciarDescarga(appActual);
}

function instalarDirecto(id) {
  var app = apps.find(function(a) { return a.id === id; });
  iniciarDescarga(app);
}

function iniciarDescarga(app) {
  versiones[app.id] = app.version;
  try { localStorage.setItem('ob_ver', JSON.stringify(versiones)); } catch(e) {}
  document.getElementById('modal').classList.remove('open');
  window.open(app.url_apk, '_blank');
  renderNovedades();
}

cargarApps();
</script>
</body>
</html>
